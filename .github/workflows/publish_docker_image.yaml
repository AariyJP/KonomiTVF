
name: Publish Docker Image

# develop ブランチに変更があったとき or タグが作成されたとき or 他のワークフローからの呼び出し or 手動実行
on:
  push:
    branches:
      - develop
    tags:
      - '*'
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ''
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# ジョブの定義
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # タグの push がトリガーのときだけ、Release のサードパーティーライブラリが確実にアップロードされるまで1分ほど待つ
      - name: Wait for Release to be Created
        if: startsWith(github.ref, 'refs/tags/v') && inputs.tag == ''
        run: |
          sleep 60s

      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # GitHub Container Registry (ghcr.io) にログイン
      - name: Login to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker イメージのタグ付け用のメタデータを抽出
      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag
            type=ref,event=branch,enable=${{ inputs.tag == '' }}

      # Docker イメージをビルドして公開
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # おそらく使われることのない、Untagged なイメージをすべて削除する
      # ref: https://github.com/vlaurin/action-ghcr-prune
      - name: Prune Untagged Docker Images
        uses: vlaurin/action-ghcr-prune@v0.6.0
        continue-on-error: true
        with:
          token: ${{ secrets.DELETE_GHCR_IMAGES_TOKEN || secrets.GITHUB_TOKEN }}
          container: konomitvf
          dry-run: false
          prune-untagged: true
