
name: Publish Release

# 他のワークフローからの呼び出し or 手動実行
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'リリースするバージョン (例: 2026.10.20、v はつけない)'
        required: true
      ref:
        type: string
        description: 'リリースするコミット (コミットハッシュまたはブランチ名)'
        required: true
        default: 'main'

# ジョブの定義
jobs:

  # インストーラーのビルド
  build_installer:
    uses: ./.github/workflows/build_installer.yaml
    with:
      ref: ${{ inputs.ref }}

  # サードパーティーライブラリのビルド
  build_thirdparty:
    uses: ./.github/workflows/build_thirdparty.yaml

  # 両方のビルドが終わったら、タグ付けしてリリースを公開
  publish_release:
    runs-on: ubuntu-22.04
    needs:
      - build_installer
      - build_thirdparty
    permissions:
      contents: write
    steps:

      # ビルド済みのインストーラーとサードパーティーライブラリをダウンロード
      - name: Download Installer (for Windows)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer.exe
          path: ${{ github.workspace }}/
      - name: Download Installer (for Linux)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer.elf
          path: ${{ github.workspace }}/
      - name: Download Installer (for Linux ARM)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer-ARM.elf
          path: ${{ github.workspace }}/
      - name: Download Thirdparty Library (for Windows)
        uses: actions/download-artifact@v4
        with:
          name: thirdparty-windows.7z
          path: ${{ github.workspace }}/
      - name: Download Thirdparty Library (for Linux)
        uses: actions/download-artifact@v4
        with:
          name: thirdparty-linux.tar.xz
          path: ${{ github.workspace }}/
      - name: Download Thirdparty Library (for Linux ARM)
        uses: actions/download-artifact@v4
        with:
          name: thirdparty-linux-arm.tar.xz
          path: ${{ github.workspace }}/

      # リリースを作成
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'KonomiTV-Installer.exe,KonomiTV-Installer.elf,KonomiTV-Installer-ARM.elf,thirdparty-windows.7z,thirdparty-linux.tar.xz,thirdparty-linux-arm.tar.xz'
          generateReleaseNotes: true
          name: v${{ inputs.version }}
          tag: v${{ inputs.version }}
          commit: ${{ inputs.ref }}
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  publish_docker_image:
    needs: publish_release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish_docker_image.yaml
    with:
      tag: v${{ inputs.version }}
    secrets: inherit
