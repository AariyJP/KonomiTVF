
name: Create Release Commit

# 手動実行
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'リリースするバージョン (空欄なら実行時の JST の日付で YYYY.M.D、v はつけない)'
        required: false
        default: ''

# ジョブの定義
jobs:

  # リリースコミットの作成
  create_release_commit:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      sha: ${{ steps.create_release_commit.outputs.sha }}
    steps:

      # KonomiTV のソースコードをチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node.js 20 環境をセットアップ
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          cache: 'yarn'
          cache-dependency-path: '${{ github.workspace }}/client/yarn.lock'

      # uv をセットアップ
      ## pyproject.toml のバージョンを更新した後、uv.lock に記録されているプロジェクトのバージョンも更新するために利用する
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.12.18'

      - name: Get Version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(TZ=Asia/Tokyo date '+%Y.%-m.%-d')"
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # リリースコミットを作成
      - name: Create Release Commit
        id: create_release_commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch main
          git read-tree --reset -u origin/develop

          # ソースコードやドキュメント内のバージョンを更新
          sed -i -e "s|\"version\": \".*\",|\"version\": \"${VERSION}\",|" client/package.json
          sed -i -e "s|^version = \".*\"|version = \"${VERSION}\"|" installer/pyproject.toml
          sed -i -e "s|TARGET_VERSION = '.*'|TARGET_VERSION = '${VERSION}'|" installer/KonomiTV-Installer.py
          sed -i -e "s|^version = \".*\"|version = \"${VERSION}\"|" server/pyproject.toml
          sed -i -e "s|VERSION = '.*'|VERSION = '${VERSION}'|" server/app/constants.py
          sed -i -e "s|https://github.com/.*/releases/download/v.*/KonomiTV-Installer\.elf|https://github.com/AariyJP/KonomiTVF/releases/download/v${VERSION}/KonomiTV-Installer.elf|" Readme.md
          sed -i \
            -e "s|^# RUN aria2c -x10 https://github.com/.*/releases/download/v.*/thirdparty-linux\.tar\.xz$|RUN aria2c -x10 https://github.com/AariyJP/KonomiTVF/releases/download/v${VERSION}/thirdparty-linux.tar.xz|" \
            -e "s|^RUN aria2c -x10 https://github.com/.*/releases/download/v.*/thirdparty-linux\.tar\.xz$|RUN aria2c -x10 https://github.com/AariyJP/KonomiTVF/releases/download/v${VERSION}/thirdparty-linux.tar.xz|" \
            -e "s|^# RUN tar xvf thirdparty-linux\.tar\.xz$|RUN tar xvf thirdparty-linux.tar.xz|" \
            -e "s|^RUN aria2c -x10 https://nightly\.link/|# RUN aria2c -x10 https://nightly.link/|" \
            -e "s|^RUN unzip thirdparty-linux\.tar\.xz\.zip|# RUN unzip thirdparty-linux.tar.xz.zip|" \
            Dockerfile
          grep -q "^RUN aria2c -x10 https://github.com/AariyJP/KonomiTVF/releases/download/v${VERSION}/thirdparty-linux\.tar\.xz$" Dockerfile

          # uv.lock に記録されているプロジェクトのバージョンを更新
          ## 依存パッケージのバージョンは変更せず、pyproject.toml のバージョンの変更だけを反映する
          (cd server/ && uv lock)
          (cd installer/ && uv lock)

          # クライアントをビルド
          cd client/
          yarn install --frozen-lockfile
          yarn build
          cd ../

          # リリースコミットを作成
          git add -A
          git add -f client/dist/
          git commit -m "v${VERSION}"
          TEMP_REF="release-commit-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${TEMP_REF}"
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits" \
            -f message="v${VERSION}" \
            -f tree="$(git rev-parse 'HEAD^{tree}')" \
            -f "parents[]=$(git rev-parse HEAD^)" \
            --jq .sha)"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TEMP_REF}"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" -f sha="${SHA}"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

  publish_release:
    needs: create_release_commit
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish_release.yaml
    with:
      version: ${{ needs.create_release_commit.outputs.version }}
      ref: ${{ needs.create_release_commit.outputs.sha }}
    secrets: inherit
